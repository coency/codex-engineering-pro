name: 桌面插件检查与发布
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    name: Windows 插件验证
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node scripts/validate.mjs .
      - run: node --test scripts/test-validator.mjs

  publish:
    name: 发布已验证的桌面插件
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: 从标签打包并检查解压内容
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./plugins/codex-engineering-pro/plugin.json').version")
          test "$GITHUB_REF_NAME" = "v$version"
          bundle="codex-engineering-pro-$version"
          git archive --format=zip -o "$RUNNER_TEMP/$bundle.zip" HEAD:plugins/codex-engineering-pro
          python scripts/verify-upload-zip.py "$RUNNER_TEMP/$bundle.zip" plugins/codex-engineering-pro
          cd "$RUNNER_TEMP"
          sha256sum "$bundle.zip" > "$bundle.zip.sha256"
          echo "BUNDLE=$bundle" >> "$GITHUB_ENV"
      - name: 上传附件并公开 Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$tag" --verify-tag --draft --title "$tag" --notes "面向 Codex 桌面端的中文工程插件，包含七个技能和智能模式 B。在桌面端“添加插件”中选择本地 ZIP，直接上传附件 $BUNDLE.zip。请勿选择 Source code (zip)。"
          fi
          gh release upload "$tag" "$RUNNER_TEMP/$BUNDLE.zip" "$RUNNER_TEMP/$BUNDLE.zip.sha256" --clobber
          gh release edit "$tag" --title "$tag" --draft=false
